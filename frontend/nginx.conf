# Rate-limit zones keyed on the forwarded client IP: this container is only
# reachable through Caddy, which sets X-Forwarded-For.
limit_req_zone   $http_x_forwarded_for  zone=api:10m    rate=240r/m;
limit_req_zone   $http_x_forwarded_for  zone=assets:10m rate=600r/m;
limit_conn_zone  $http_x_forwarded_for  zone=conns:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;
    client_body_timeout  10s;
    client_header_timeout 10s;
    send_timeout 30s;

    limit_conn conns 30;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Microphone (note detection) and MIDI keyboards are features of the app.
    add_header Permissions-Policy "geolocation=(), camera=(), payment=(), microphone=(self), midi=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://cdn-images.dzcdn.net https://e-cdns-images.dzcdn.net https://*.mzstatic.com; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        limit_req zone=assets burst=120 nodelay;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        limit_req zone=assets burst=200 nodelay;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /samples/ {
        limit_req zone=assets burst=200 nodelay;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /api/ {
        limit_req zone=api burst=120 nodelay;
        # Imported pieces can weigh a few MB of notes.
        client_max_body_size 8m;

        proxy_pass http://piano-backend-estv:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
        proxy_buffering on;
    }

    # Health checks bypass the rate limiter.
    location = /health {
        proxy_pass http://piano-backend-estv:8080;
        access_log off;
    }
}
