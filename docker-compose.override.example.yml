# Local dev: `cp docker-compose.override.example.yml docker-compose.override.yml`
# (gitignored), then `docker compose up`. Site on http://127.0.0.1:8096.
#
# Runs the dev servers on the mounted sources: every save is live (Vite hot
# reload, tsx watch). Only `docker compose restart <service>` after changing a
# package.json. node_modules live in named volumes (one per container): the
# host's node_modules would not load in the containers.

x-dev-node: &dev-node
  build: !reset null
  working_dir: /app
  read_only: false
  cap_drop: !reset []
  # Production caps would OOM npm install and Vite.
  deploy: !reset {}
  environment: &dev-env
    NODE_ENV: development
    npm_config_cache: /tmp/.npm
    npm_config_update_notifier: "false"

services:
  backend:
    <<: *dev-node
    # Debian image: ships python3/make/g++ to compile better-sqlite3.
    image: node:24
    command: >
      sh -c "npm install --no-audit --no-fund --no-save --workspace backend
      && mkdir -p data && chown -R node:node node_modules data
      && exec su node -s /bin/sh -c 'npm run dev -w backend'"
    volumes: !override
      - .:/app
      - backend_node_modules:/app/node_modules
    environment:
      <<: *dev-env
      PORT: "8080"
      COOKIE_SECURE: "0"
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_VISION_MODEL: ${MISTRAL_VISION_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    healthcheck:
      start_period: 180s

  frontend:
    <<: *dev-node
    image: node:24-alpine
    # Frontend deps only: no native module to build.
    command: >
      sh -c "npm install --no-audit --no-fund --no-save --workspace frontend
      && chown -R node:node node_modules
      && exec su node -s /bin/sh -c 'npm run dev -w frontend -- --host 0.0.0.0 --port 5173 --strictPort'"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    environment:
      <<: *dev-env
      API_TARGET: http://backend:8080
    ports:
      - "127.0.0.1:8096:5173"

volumes:
  backend_node_modules:
  frontend_node_modules:

networks:
  caddy_net:
    external: false
